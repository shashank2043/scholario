plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

dependencies {
    implementation project(':scholario-book-module')
    implementation project(':scholario-user-module')
    implementation project(':scholario-auth-module')
    implementation project(':scholario-reserve-module')
    implementation project(':scholario-course-module')
    implementation project(':scholario-lending-module')
    implementation project(':scholario-review-module')
    implementation project(':scholario-notification-module')
    implementation project(':scholario-royalty-module')
    implementation project(':scholario-content-module')
    implementation project(':scholario-violation-module')
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-graphql'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'com.h2database:h2'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-graphql-test'
}
spring:
  application:
    name: scholario

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:mysql://localhost:3306/scholario?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: scholario
    password: Scholario@123
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: true
    defer-datasource-initialization: true

  graphql:
    graphiql:
      enabled: true
    path: /graphql
    schema:
      locations: "classpath*:graphql/**/"
    servlet:
      mapping: /graphql

  h2:
    console:
      enabled: true
      path: /h2-console

  security:
    keycloak:
      enabled: ${KEYCLOAK_ENABLED:true}
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/scholario}

server:
  port: 8090

logging:
  level:
    com.scholario: DEBUG